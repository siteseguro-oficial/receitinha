<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Receitinha do Dia</title>

  <!-- Troque aqui se seu subdomínio for outro -->
  <meta name="description" content="Receitinha do Dia" />

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; width: 100%; background: #000; overflow: hidden; }

    /* Loader simples */
    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 12px;
      background: #000; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      z-index: 10;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 999px;
      background: currentColor;
      animation: bounce 1s infinite ease-in-out;
      opacity: .9;
    }
    .dot:nth-child(2) { animation-delay: .15s; opacity: .7; }
    .dot:nth-child(3) { animation-delay: .3s; opacity: .5; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* Iframe full screen */
    .frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      background: #000;
    }

    /* Fallback caso iframe bloqueie */
    .fallback {
      position: fixed; inset: 0;
      display: none;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .fallback a {
      display: inline-block;
      margin-top: 14px;
      color: #fff;
      text-decoration: underline;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="loading" id="loading" aria-live="polite">
    Carregando <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <iframe
    class="frame"
    id="appFrame"
    title="Receitinha do Dia"
    src="https://receitinha-do-dia.lovable.app"
    allow="clipboard-read; clipboard-write; fullscreen; autoplay; payment"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <div class="fallback" id="fallback">
    <h1 style="font-size:20px; line-height:1.2;">Abrir o site</h1>
    <p style="margin-top:10px; opacity:.85;">
      Seu navegador ou o domínio do app pode bloquear a exibição via iframe.
      Clique abaixo para abrir diretamente.
    </p>
    <a href="https://receitinha-do-dia.lovable.app" rel="noopener noreferrer">Abrir Receitinha do Dia</a>
  </div>

  <script>
    (function () {
      const frame = document.getElementById("appFrame");
      const loading = document.getElementById("loading");
      const fallback = document.getElementById("fallback");

      let loaded = false;

      frame.addEventListener("load", () => {
        loaded = true;
        loading.style.display = "none";
      });

      // Se não carregar em ~6s, mostra fallback (muitas vezes é bloqueio de iframe)
      setTimeout(() => {
        if (!loaded) {
          loading.style.display = "none";
          fallback.style.display = "block";
        }
      }, 6000);
    })();
  </script>
</body>
</html>
